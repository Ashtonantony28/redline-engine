# docs/REPORT.md builder settings (report/build.py). Every number in the report is computed from the code,
# spec files and committed fixtures at build time and labelled MODELLED.
output: docs/REPORT.md
figures_dir: out/report          # figures the report regenerates itself from committed fixtures
thermo_point: {rpm: 3000.0, load: full}
hil_cycles: [idle, tipin]
# out/ artefacts produced by tools the report does not rerun (slow, or needing Verilator / the RTL tree)
external_artefacts:
  cad_mass_properties: out/cad/mass_properties.json   # python -m cad.build
  cosim: out/hil/cosim.json                           # make -C hil cosim (Vortex-V Verilator co-sim)
  realtime: out/hil/realtime.json                     # make -C hil cosim (M9.1 real-time runs, 50 MHz)
  realtime_sweep: out/hil/realtime_sweep.json         # make -C hil rt-sweep (clock sweep, minimum clock)
# frozen-time figures of the M9 firmware (commit da63d32, out/hil/cosim.json at that commit): M9.1 rebuilt
# the firmware, so the report quotes them as the baseline next to the current ones
m9_baseline: {crank_handler_cycles_mean: 1430, slow_handler_cycles_mean: 44150, crank_worst_us: 39.3,
              slow_worst_us: 934, cpu_utilisation_at_redline: 1.067, polled_worst_tooth_latency_us: 973}
