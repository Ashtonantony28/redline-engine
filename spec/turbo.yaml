# Redline I4-2.0T: turbocharged variant (PLAN.md option B, M10 stretch). An OVERRIDE LAYER over
# spec/engine.yaml, spec/gasdyn.yaml and spec/combustion_ext.yaml: those files stay untouched and remain the
# single source of truth for everything not listed here. SI units unless the key ends in _deg (ADR 0001).
# Exponents carry an explicit sign (PyYAML reads 1e5 as a string).
#
# Every number is a MODELLED design value: there is no physical engine and no physical turbocharger
# (CLAUDE.md rule 5). The compressor and turbine maps are SYNTHETIC: generated from the non-dimensional
# models in turbo/maps.py (openly published maps of a suitably sized machine were not available), sized
# here for a ~1.5-2.0 pressure ratio at the flow of this 2.0 L engine.

variant:
  name: Redline I4-2.0T
  # dotted-key overrides of spec/engine.yaml
  engine_overrides:
    engine.name: Redline I4-2.0T
    engine.compression_ratio: 9.0      # lowered from 10.5 for knock margin at boost. Port injection (no
                                       # direct-injection charge cooling) at 95 RON: 9.5 was tried first
                                       # and was knock-limited to 216-248 Nm on the 1500-6500 sweep (thermo.knock,
                                       # 2026-11-21); 9.0 is typical of PFI turbo engines.
  # dotted-key overrides of spec/gasdyn.yaml (same runners, plenum, throttle and 4-2-1 header). The
  # catalyst downpipe and tailpipe are enlarged for the ~1.7x exhaust flow: with the NA 55 mm pipes the
  # post-turbine pressure reached 1.36 bar at 4500 rpm WOT (1.18 bar with these).
  gasdyn_overrides:
    exhaust.tailpipe_front.diameter: 0.070
    exhaust.tailpipe_rear.diameter: 0.065
  targets:                             # modelled design intent (stated, not tuned to)
    torque_plateau_nm: [250.0, 300.0]
    power_kw: [150.0, 170.0]

layout:                                # extra network elements (gasdyn.engine `boost` layout)
  charge_air_volume: 6.0e-3            # m^3: compressor outlet + intercooler core + ducting to the throttle
  p_charge_init: 101325.0              # Pa, cold start
  post_turbine_volume: 0.5e-3          # m^3: turbine outlet / wastegate merge before the catalyst downpipe
  turbine_pipe:                        # collector -> turbine housing (volute) inlet
    length: 0.150
    diameter: 0.042
    wall_T: 900.0
    friction_multiplier: 1.0
    heat_multiplier: 1.0
  wastegate_pipe:                      # collector -> wastegate port (bypass in parallel with the turbine)
    length: 0.080
    diameter: 0.025
    wall_T: 900.0
    friction_multiplier: 1.0
    heat_multiplier: 1.0

air_filter:                            # air box + filter, compressor inlet loss dp = dp_ref (m/m_ref)^2 rho_ref/rho
  dp_ref: 2.5e+3                       # Pa
  m_ref: 0.20                          # kg/s
  rho_ref: 1.18                        # kg/m^3

intercooler:                           # air-to-air, effectiveness model
  effectiveness: 0.80
  T_coolant: 298.15                    # K (ambient air through the core)
  dp_ref: 10.0e+3                      # Pa at m_ref, rho_ref (charge side)
  m_ref: 0.20                          # kg/s
  rho_ref: 2.0                         # kg/m^3

compressor:
  # SYNTHETIC centrifugal compressor map (turbo/maps.py CompressorMap). Non-dimensional model:
  #   tip speed U2 = omega D2 / 2, tip Mach Mu = U2 / a01, flow coefficient phi = m / (rho01 U2 D2^2)
  #   Euler work (backswept impeller): dh0 = lambda U2^2, lambda = lambda_0 - lambda_slope phi
  #   choke (inducer throat): phi_ch(Mu) = phi_choke_0 / sqrt(1 + (Mu / mach_choke)^2)
  #   efficiency islands: eta = eta_peak (1 - k_M (Mu - Mu_opt)^2) (1 - ((x - x_pk)/x_w)^2) (1 - x^n_ch),
  #                       x = phi / phi_ch
  #   pressure ratio:     PR = (1 + eta dh0 / (cp T01))^(g / (g - 1))
  #   surge line: zero slope of each speed line (dPR/dm = 0), the classical static-instability limit.
  # Sized for ~0.05-0.22 kg/s at PR 1.5-2.0 (a "GT28-class" machine; the numbers are not any product's).
  impeller_diameter: 0.052             # m, D2 (exducer tip)
  lambda_0: 0.90                       # work coefficient at zero flow (backswept blades)
  lambda_slope: 1.5                    # d lambda / d phi
  eta_peak: 0.76                       # total-to-total, best island
  mach_opt: 1.0                        # tip Mach of the best island
  eta_mach_coeff: 0.10                 # island fall-off with tip Mach
  phi_choke_0: 0.24                    # low-speed choke flow coefficient
  mach_choke: 1.4                      # tip Mach above which the inducer throat chokes
  x_peak: 0.33                         # phi/phi_ch of peak efficiency on a speed line
  x_width_surge_side: 0.90             # half-width of the efficiency parabola left of x_peak (phi/phi_ch)
  x_width_choke_side: 1.80             # half-width right of x_peak (choke side)
  choke_exp: 16.0                      # steepness of the efficiency (and PR) collapse at choke
  surge_band_pr: 0.10                  # left of surge: flow falls linearly to 0 over this PR excess (flagged)
  bypass_area: 1.2e-3                  # m^2, effective area of the compressor as a passive restriction
                                       # (flow beyond choke, PR < 1; the zero-speed characteristic)
  min_pr: 0.30                         # lower bound of the beyond-choke extension (root bracket)
  mach_table_max: 2.0                  # surge-line table: tip Mach range [0, max]
  mach_table_n: 401

turbine:
  # SYNTHETIC radial turbine (turbo/maps.py TurbineMap):
  #   flow: isentropic nozzle of equivalent area A_eq (the kernel orifice boundary, Watson & Janota ch. 4)
  #   efficiency (total-to-static): eta = eta_max (1 - ((BSR - BSR_opt) / BSR_opt)^2), BSR = U_T / c_is,
  #   c_is = sqrt(2 cp T03 (1 - (p4/p03)^((g-1)/g)))  (Watson & Janota ch. 5; parabolic BSR fit)
  equivalent_area: 3.5e-4              # m^2 (nozzle-equivalent area, sized for the 2.0 L flow)
  rotor_diameter: 0.056                # m, inlet tip
  eta_max: 0.70
  bsr_opt: 0.65
  eta_floor: 0.0

shaft:
  inertia: 2.0e-5                      # kg m^2, compressor wheel + turbine wheel + shaft (order 1e-5..5e-5
                                       # for 45-60 mm wheels; a synthetic design value, not a product's)
  mechanical_efficiency: 0.95          # bearing losses, applied to the turbine power
  max_speed_rpm: 200000.0              # over-speed guard (reported if reached)
  min_speed_rpm: 1000.0                # floor of the integration (wheel never stops in the model)

wastegate:
  max_area: 6.0e-4                     # m^2, fully open poppet
  actuator_tau: 0.05                   # s, first-order actuator lag

boost_control:
  # Wastegate PI on the intake-plenum pressure (MAP), Python side (turbo/control.py): the C11 ECU has
  # no boost output and its MAP axis ends at 1.15 bar, so a boost hook there is not a clean fit.
  # opening = clamp(i - kp e), di/dt = -ki e, e = (target - MAP_filtered) / target, conditional
  # integration (anti-windup) while the output is saturated.
  target_rpm: [1500.0, 2000.0, 2500.0, 3000.0, 4000.0, 5000.0, 6000.0, 6500.0, 7000.0]
  target_map: [1.45e+5, 1.65e+5, 1.65e+5, 1.65e+5, 1.65e+5, 1.65e+5, 1.65e+5, 1.65e+5, 1.60e+5]   # Pa abs
  kp: 2.0
  ki: 10.0                             # 1/s
  map_filter_tau: 0.02                 # s, first-order filter of the measured MAP
  opening_init: 0.0                    # wastegate opening at a cold start of a steady point
  no_demand_opening: 0.0               # opening with no boost demand (part load): a spring-loaded pneumatic
                                       # actuator keeps the wastegate shut below its cracking pressure
  hold_tol: 0.03                       # steady acceptance band: |MAP/target - 1| <= 3 %

steady:
  substep_deg: 5.0                     # crank-angle split for the element updates
  inertia_factor: 0.1                  # rotor inertia scale used only to reach steady state faster
  init_speed_rpm: 100000.0             # turbo speed at a cold start
  max_cycles: 120
  min_cycles: 6                        # cold start
  min_cycles_warm: 3                   # re-runs from a converged state (knock-limited spark passes)
  speed_tol: 2.0e-3                    # relative cycle-to-cycle change of the cycle-mean turbo speed
  map_tol: 1.0e-2                      # |cycle-mean MAP / target - 1| below which control counts as settled
  consecutive: 3
  spark_passes: 1                      # knock-limited spark re-optimised once on the re-converged state
  surge_margin_min: 0.10               # required flow margin m / m_surge - 1 at constant speed

tipin:
  rpm: 2000.0                          # dyno-held speed
  throttle_deg: 18.0                   # part-load throttle before the tip-in
  pre_s: 0.18                          # s at part load (no boost demand) before the step
  duration_s: 3.5                      # s after the tip-in (upper bound of the recorded window)
  settle_cycles: 8                     # part-load cycles before the recorded window (scaled inertia)
  stop_hold_cycles: 3                  # end the window once MAP stays above both 90 % levels this long
  boost_fraction: 0.90                 # lag = time to this fraction of the MAP rise to target

sweep:
  default_rpm: [1500.0, 6500.0, 500.0]
  test_rpm: [2000.0, 4500.0]
