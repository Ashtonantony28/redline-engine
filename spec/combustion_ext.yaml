# Redline M7 combustion extensions: knock, quasi-dimensional flame, emissions, spark and maps.
# Supplements spec/engine.yaml, spec/thermo.yaml and spec/gasdyn.yaml; never duplicates them.
# SI units unless the key ends in _deg (ADR 0001). Exponents are written with explicit signs
# (PyYAML reads 1e5 as a string). Every number produced with this file is MODELLED (CLAUDE.md rule 5).

knock:
  # Fuel anti-knock quality. Douaud & Eyzat fitted their correlation to PRF blends, so the octane
  # number is used as a PRF-equivalent research octane number. 95 RON = EN 228 premium unleaded.
  octane_number: 95.0
  # Douaud-Eyzat autoignition delay (A. M. Douaud and P. Eyzat, "Four-Octane-Number Method for
  # Predicting the Anti-Knock Behavior of Fuels and Engines", SAE 780080, 1978; Heywood 1988 eq. 9.66):
  #   tau [ms] = 17.68 (ON / 100)^3.402 p[atm]^-1.7 exp(3800 / T[K])
  douaud_eyzat:
    A: 17.68e-3                # s (17.68 ms)
    on_ref: 100.0
    on_exp: 3.402
    p_unit: 101325.0           # Pa per atm
    p_exp: -1.7
    T_activation: 3800.0       # K
  # Livengood & Wu (6th Symp. (Int.) on Combustion, 1957, pp. 347-356): autoignition when
  # integral_{IVC}^{t} dt / tau(p, T_u) reaches 1.
  integral_threshold: 1.0
  # Knock counts only if autoignition happens while at least (1 - end_gas_xb_limit) of the charge is
  # still unburned (onset before CA90): a tiny residual end gas releases too little energy to be
  # audible. Modelling choice of this project, stated rather than tuned.
  end_gas_xb_limit: 0.90
  klsa_margin_deg: 2.0         # spark is held this far retarded from the knock-limited advance

spark:
  advance_min_deg: -10.0       # search window, deg BTDC (negative = after TDC)
  advance_max_deg: 50.0
  mbt_coarse_step_deg: 10.0    # coarse scan before the golden section
  mbt_tol_deg: 0.2             # golden-section bracket width at which MBT is accepted
  klsa_scan_step_deg: 2.5      # scan from the retarded end for the first knock crossing, then bisect
  klsa_tol_deg: 0.1            # bisection bracket width of the knock-limited spark advance
  # Wiebe option: spark-to-start-of-combustion delay = engine.yaml spark_advance_deg + heat_release_start_deg
  # (25 BTDC spark, 15 BTDC start of heat release -> 10 deg), duration and shape from engine.yaml.

flame:
  # Burn-rate model used by the maps: "flame" (this file) or "wiebe" (engine.yaml, shifted with spark).
  model: flame
  # Laminar burning velocity, Metghalchi & Keck, Combust. Flame 48 (1982) 191-210, as tabulated in
  # Heywood 1988 eqs. 9.36-9.37 and Table 9.3 (iso-octane):
  #   S_L0 = B_M + B_phi (phi - phi_M)^2,  S_L = S_L0 (T_u/T0)^alpha (p/p0)^beta (1 - c_dil x_dil^e_dil)
  #   alpha = 2.18 - 0.8 (phi - 1),  beta = -0.16 + 0.22 (phi - 1)
  laminar:
    fuel: iso-octane
    phi_M: 1.13
    B_M: 0.2632                # m/s (26.32 cm/s)
    B_phi: -0.8472             # m/s (-84.72 cm/s)
    alpha_0: 2.18
    alpha_phi: -0.8
    beta_0: -0.16
    beta_phi: 0.22
    T0: 298.0                  # K
    p0: 101325.0               # Pa
    # residual dilution, Rhodes & Keck SAE 850047 (1985), Heywood eq. 9.38: (1 - 2.06 x_dil^0.77)
    dilution_coeff: 2.06
    dilution_exp: 0.77
  # 0D k-epsilon turbulence of the unburned charge from IVC (rapid-distortion compression terms
  # k ~ rho^(2/3), eps ~ rho^(4/3) as in Morel & Mansour SAE 820040 (1982), plus decay
  # dk/dt = -eps, deps/dt = -C_eps2 eps^2 / k with the standard k-eps constant, Launder & Spalding,
  # Comput. Methods Appl. Mech. Eng. 3 (1974) 269-289).
  turbulence:
    C_eps2: 1.92
    u_ivc_per_sp: 0.80         # u' at IVC / mean piston speed (intake jet turbulence)
    L_ivc_per_lift: 1.0        # integral length scale at IVC / max intake valve lift (Heywood sec. 8.2.2)
  # Entrainment / burn-up (Blizard & Keck SAE 740191, 1974; Tabaczynski, Ferguson & Radhakrishnan
  # SAE 770647, 1977; Heywood 1988 eqs. 14.36-14.38):
  #   dm_e/dt = rho_u A_f (C_T u' (1 - exp(-r_f / L)) + S_L),  dm_b/dt = rho_u A_f S_L + (m_e - m_b) / tau_b
  #   tau_b = lambda_T / S_L,  Taylor microscale lambda_T = sqrt(15 nu u'^2 / eps)
  # C_T is the single calibration constant: chosen so the 3000 rpm WOT burn on the M4 trapped state
  # with the engine.yaml 25 deg BTDC spark reproduces the engine.yaml Wiebe burn (CA50 10.9 deg ATDC,
  # CA10-90 24.8 deg): C_T = 2.2 gives CA50 11.0, CA10-90 22.9 (tests/test_m7_maps.py checks this).
  entrainment_coeff: 2.2      # C_T [-]
  # Optional kernel-development factor f_dev = 1 - exp(-r_f / (scale L)) on the turbulent entrainment
  # term (Herweg & Maly, SAE 922243, 1992). Off (0) in the calibrated model: with it the 3000 rpm burn
  # could not match both the Wiebe CA50 and CA10-90 with a single C_T.
  kernel_development_scale: 0.0
  kernel_radius: 1.0e-3        # m, flame radius at spark (ignition kernel)
  plug: centre                 # flame centred on the bore axis at the fire deck; chamber = flat disc
  # staggered coupling with the two-zone model: burn law -> two-zone -> burn law, until converged
  coupling_tol: 1.0e-4         # max |delta x_b| between iterations
  coupling_max_iter: 25

emissions:
  # Extended Zeldovich mechanism, rate constants from Heywood 1988 Table 11.1 (after Hanson & Salimian
  # 1984), k = A T^n exp(-E / T) in cm^3/(mol s), converted to m^3/(mol s) by cm3_to_m3:
  #   (1) O + N2 = NO + N      (2) N + O2 = NO + O      (3) N + OH = NO + H
  zeldovich:
    cm3_to_m3: 1.0e-6
    k1f: {A: 7.6e+13, n: 0.0, E: 38000.0}
    k1r: {A: 1.6e+13, n: 0.0, E: 0.0}
    k2f: {A: 6.4e+9, n: 1.0, E: 3150.0}
    k2r: {A: 1.5e+9, n: 1.0, E: 19500.0}
    k3f: {A: 4.1e+13, n: 0.0, E: 0.0}
    k3r: {A: 2.0e+14, n: 0.0, E: 23650.0}
  # NO chemistry is frozen at EVO (Heywood sec. 11.2.2). The burned zone is split into burned-mass
  # elements (Heywood sec. 11.2.3, Lavoie, Heywood & Keck 1970): each element starts at the adiabatic
  # flame temperature of the unburned gas it came from and is then compressed / expanded isentropically,
  # with temperatures scaled so their mass average stays the two-zone burned-zone temperature.
  n_elements: 20               # 1 = single burned zone at the two-zone T_b
  newton_tol: 1.0e-12
  newton_max_iter: 30
  # NOx mass is reported as NO2 equivalent, the regulatory convention (40 CFR 1065.650; UN ECE R83).
  nox_as: NO2
  # Equilibrium burned-gas composition table (Cantera, same grid as spec/thermo.yaml tables).
  table_species: ["N2", "O2", "O", "OH", "H", "N", "NO", "CO", "CO2", "H2O"]
  log_floor: 1.0e-30           # mole fractions are interpolated in ln X; floor for ln(0)

maps:
  # Default reported maps: the M4 1D gas-dynamics engine on a coarse grid.
  rpm: [1000, 2000, 3000, 4000, 5000, 6000, 7000]
  # load levels: target mean plenum pressure [Pa]; "wot" = wide-open throttle (throttle at wot_angle_deg)
  map_levels: [wot, 0.90e+5, 0.80e+5, 0.70e+5, 0.60e+5, 0.50e+5]
  # Points whose (Wiebe) trapped residual fraction exceeds this are reported as beyond the dilution
  # limit and left out of the maps: stable SI combustion is lost at ~20-30 % burned-gas dilution
  # (Heywood 1988 sec. 9.4.3; the Rhodes-Keck factor 1 - 2.06 x^0.77 falls below 0.4 at x = 0.25).
  # The M4 network gives very high residuals at low speed and part load (intake backflow during the
  # valve overlap), so the low-speed part-load corner of the M4 map is empty; the quasi-steady option
  # covers it with constant manifold states.
  dilution_limit: 0.25
  map_tol: 1.0e-2              # relative tolerance on the achieved mean plenum pressure
  throttle_max_iter: 8
  throttle_min_deg: 7.0        # search bracket of the throttle plate angle
  ve_guess: 0.85               # delivered VE for the first throttle-area guess (orifice from ambient)
  probe_deg: 10.0              # crank-angle spacing of exhaust-collector temperature samples
  spark_reconverge_passes: 1   # re-optimise spark once on the trapped state at the chosen spark
  # Quasi-steady fast option (thermo.cycle filling/emptying gas exchange, constant manifold states)
  # for dense grids. Not the reported default.
  quasi_steady:
    rpm: [1000, 7000, 500]
    map_levels: [0.98e+5, 0.90e+5, 0.80e+5, 0.70e+5, 0.60e+5, 0.50e+5, 0.40e+5, 0.30e+5]
    T_intake: 315.0            # K
    p_exhaust: 1.05e+5         # Pa
    T_exhaust: 950.0           # K
    step_deg: 0.2              # crank-angle step of the quasi-steady cycle
  # Fixture: two points rerun by the determinism test, full map rows committed in fixtures/maps/.
  fixture_points:
    - {rpm: 3000.0, level: wot}
    - {rpm: 4000.0, level: 0.70e+5}
